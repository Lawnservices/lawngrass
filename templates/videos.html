{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='videos.css') }}">

<header class="header">
    <h1>Jardines TV</h1>
    <p>Videos</p>
</header>

<main>

    <!-- REPRODUCTOR -->
    <section class="player-container">

        <div class="player">

            <iframe
                id="youtubePlayer"
                src=""
                title="Jardines TV"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

        <h2 id="videoTitle">
            Selecciona un video
        </h2>

    </section>


    <!-- VIDEOS -->
    <section>

        <h2 class="section-title">
            Videos de Jardines TV
        </h2>

        {% if videos %}

        <div class="videos">

            {% for video in videos %}

            <article class="video-card"
                     onclick="reproducirVideo('{{ video.id }}', '{{ video.title|e }}')">

                <img
                    src="{{ video.thumbnail }}"
                    alt="{{ video.title|e }}"
                    loading="lazy"
                >

                <h3>{{ video.title }}</h3>

            </article>

            {% endfor %}

        </div>

        {% else %}

        <p class="no-videos">
            No hay videos disponibles en este momento.
        </p>

        {% endif %}

    </section>

</main>


<script>
function reproducirVideo(videoId, titulo) {

    const player = document.getElementById("youtubePlayer");
    const videoTitle = document.getElementById("videoTitle");

    player.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&rel=0";

    videoTitle.textContent = titulo;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>

{% endblock %}
