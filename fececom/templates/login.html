{% extends "base.html" %}
{% block title %}Iniciar sesión · Face.com{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card card">
  <p class="eyebrow">QUÉ BUENO VERTE</p><h1>Inicia sesión</h1><p class="muted">Entra para compartir con la comunidad.</p>
  <form method="post" class="form-stack">
    <label for="identity">Usuario o correo electrónico</label><input id="identity" name="identity" required autocomplete="username" placeholder="Tu usuario o correo">
    <label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Tu contraseña">
    <button class="button full" type="submit">Entrar</button>
  </form>
  <p class="auth-switch">¿Todavía no tienes cuenta? <a href="{{ url_for('register') }}">Regístrate gratis</a></p>
</section></div>
{% endblock %}
