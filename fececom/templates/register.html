{% extends "base.html" %}
{% block title %}Crear cuenta · Face.con{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card card">
  <p class="eyebrow">EMPIEZA HOY</p><h1>Crea tu cuenta</h1><p class="muted">Únete a la comunidad Face.con.</p>
  <form method="post" class="form-stack">
    <label for="username">Nombre de usuario</label><input id="username" name="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="ej. miguel123">
    <small class="muted">3–30 caracteres: letras, números, punto, guion o guion bajo.</small>
    <label for="email">Correo electrónico</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="tu@correo.com">
    <label for="password">Contraseña</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    <button class="button full" type="submit">Crear cuenta</button>
  </form>
  <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</section></div>
{% endblock %}
